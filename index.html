<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日例行事項</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每日打卡">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(160deg, #f8f6ff 0%, #eaf4fd 55%, #fff9e6 100%); min-height: 100vh; font-family: 'Noto Sans TC', sans-serif; }
    input, textarea, select, button { font-family: inherit; }
    .pet-sprite.facing-left { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect, useMemo } = React;

    const WORKER_URL = "https://daily-routine-worker.kailanxh.workers.dev";

    // ── 週期邊界計算：跟 Worker 的 src/period.js 邏輯一致，全部從凌晨 5 點起算 ──
    function taipeiParts(date) {
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Taipei', hourCycle: 'h23',
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
      });
      const p = Object.fromEntries(fmt.formatToParts(date).map(x => [x.type, x.value]));
      return { year: Number(p.year), month: Number(p.month), day: Number(p.day), hour: Number(p.hour), minute: Number(p.minute) };
    }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function businessDateParts(date = new Date()) {
      const p = taipeiParts(date);
      const d = new Date(Date.UTC(p.year, p.month - 1, p.day));
      if (p.hour < 5) d.setUTCDate(d.getUTCDate() - 1);
      return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate() };
    }
    function dayKey(bp) { return `${bp.year}-${pad2(bp.month)}-${pad2(bp.day)}`; }
    function isoWeekKey(bp) {
      const d = new Date(Date.UTC(bp.year, bp.month - 1, bp.day));
      const dayNum = (d.getUTCDay() + 6) % 7;
      d.setUTCDate(d.getUTCDate() - dayNum + 3);
      const isoYear = d.getUTCFullYear();
      const jan4 = new Date(Date.UTC(isoYear, 0, 4));
      const jan4DayNum = (jan4.getUTCDay() + 6) % 7;
      const week1Monday = new Date(jan4);
      week1Monday.setUTCDate(jan4.getUTCDate() - jan4DayNum);
      const weekNum = Math.round((d - week1Monday) / (7 * 86400000)) + 1;
      return `${isoYear}-W${pad2(weekNum)}`;
    }
    function monthKey(bp) { return `${bp.year}-${pad2(bp.month)}`; }
    function quarterKey(bp) { return `${bp.year}-Q${Math.floor((bp.month - 1) / 3) + 1}`; }
    function quarterStartStr(bp) {
      const startMonth = Math.floor((bp.month - 1) / 3) * 3 + 1;
      return `${bp.year}-${pad2(startMonth)}-01`;
    }
    function periodKeyForFrequency(freq, ctx) {
      if (freq === 'weekly') return ctx.weekKey;
      if (freq === 'monthly') return ctx.monthKeyStr;
      if (freq === 'quarterly') return ctx.quarterKeyStr;
      return ctx.todayKey; // daily / daily-multi
    }
    function shortDate(s) { const [, m, d] = s.split('-'); return `${Number(m)}/${Number(d)}`; }
    function dateRangeLabel(h) {
      if (!h.is_temporary || !h.start_date) return null;
      return h.end_date && h.end_date !== h.start_date ? `${shortDate(h.start_date)} ～ ${shortDate(h.end_date)}` : shortDate(h.start_date);
    }
    function formatDate(bp) {
      return new Date(Date.UTC(bp.year, bp.month - 1, bp.day)).toLocaleDateString("zh-TW", { timeZone: "UTC", month: "long", day: "numeric", weekday: "long" });
    }

    const BLOCK_DEFS = [
      { key: 'daily', title: '今日待辦', freqs: ['daily', 'daily-multi'] },
      { key: 'weekly', title: '本週待辦', freqs: ['weekly'] },
      { key: 'monthly', title: '本月待辦', freqs: ['monthly'] },
      { key: 'quarterly', title: '本季待辦', freqs: ['quarterly'] },
    ];

    function logKey(habitId, periodKey, slot) { return `${habitId}|${periodKey}|${slot || ''}`; }

    // 期間型單次待辦（例如兩週內去領藥）：在區間內任何一天勾掉，之後的日子就不用再出現。
    function doneBeforeToday(logsByKey, habitId, todayKey) {
      for (const l of logsByKey.values()) {
        if (l.habit_id === habitId && l.done && l.date < todayKey) return true;
      }
      return false;
    }

    const ROUTINE_GROUP_ID = '__routine__';

    // 分組順序 = Projects 分頁的列順序；沒掛 project（或掛的 id 找不到對應 project）的一律歸到 Routine，排在最後。
    function groupByProject(items, projects) {
      const groups = new Map();
      for (const h of items) {
        const pid = (h.project_ids && h.project_ids[0]) || ROUTINE_GROUP_ID;
        if (!groups.has(pid)) groups.set(pid, []);
        groups.get(pid).push(h);
      }
      const order = projects.map(p => p.project_id).filter(pid => groups.has(pid));
      for (const pid of groups.keys()) {
        if (pid !== ROUTINE_GROUP_ID && !order.includes(pid)) order.push(pid);
      }
      if (groups.has(ROUTINE_GROUP_ID)) order.push(ROUTINE_GROUP_ID);
      return order.map(pid => ({
        project_id: pid,
        project_name: pid === ROUTINE_GROUP_ID ? 'Routine' : (projects.find(p => p.project_id === pid)?.project_name || pid),
        items: groups.get(pid),
      }));
    }

    const JOURNAL_HABIT_ID = "12";

    function NotePopup({ label, icon, existingNote, onSubmit, onClose, projects, selectedProjects, onToggleProject, rows }) {
      const [note, setNote] = useState(existingNote || "");
      const taRef = useRef(null);
      useEffect(() => { setTimeout(() => taRef.current && taRef.current.focus(), 50); }, []);
      const showChips = !!(projects && onToggleProject);
      return (
        <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
          <div onClick={e => e.stopPropagation()} style={{ background: "white", borderRadius: "20px 20px 0 0", padding: "20px 20px 36px", width: "100%", maxWidth: 520, boxShadow: "0 -8px 40px rgba(0,0,0,0.15)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
              <span style={{ fontSize: 20 }}>{icon}</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{label}</span>
              <button onClick={onClose} style={{ marginLeft: "auto", background: "#f5f5f5", border: "none", borderRadius: 8, padding: "4px 10px", cursor: "pointer", color: "#888" }}>✕</button>
            </div>
            <textarea ref={taRef} value={note} onChange={e => setNote(e.target.value)}
              placeholder="備注（選填，留空直接送出）…" rows={rows || 3}
              style={{ width: "100%", padding: "10px 13px", borderRadius: 10, border: "1.5px solid #e0e0e0", fontSize: 14, resize: "none", fontFamily: "'Noto Sans TC', sans-serif", outline: "none", lineHeight: 1.6 }}
            />
            {showChips && (
              <div style={{ marginTop: 12 }}>
                <div style={{ fontSize: 11, color: "#bbb", marginBottom: 6 }}>歸屬 project（點一下就存，第一個決定分組）</div>
                <ProjectChips projects={projects} selected={selectedProjects || []} onToggle={onToggleProject} />
              </div>
            )}
            <button onClick={() => onSubmit(note)} style={{ width: "100%", marginTop: 12, padding: "11px 0", background: "#1a1a2e", color: "white", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>✓ 完成勾選</button>
          </div>
        </div>
      );
    }

    function HabitRow({ icon, label, sub, checked, note, pending, failed, onCheck, onNoteClick }) {
      return (
        <div style={{ borderRadius: 12, overflow: "hidden", border: `1.5px solid ${checked ? "#4caf7d" : "#e8e8e8"}`, background: checked ? "#eef7ee" : "#fafafa", transition: "all 0.18s" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 14px" }}>
            <div onClick={onCheck} style={{ width: 23, height: 23, borderRadius: 6, flexShrink: 0, cursor: "pointer", border: `2px solid ${checked ? "#4caf7d" : "#ccc"}`, background: checked ? "#4caf7d" : "white", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {checked && <span style={{ color: "white", fontSize: 13, fontWeight: 700 }}>✓</span>}
            </div>
            <span style={{ fontSize: 18 }}>{icon}</span>
            <span onClick={onCheck} style={{ flex: 1, fontSize: 14, fontWeight: 500, cursor: "pointer", color: checked ? "#333" : "#666", textDecoration: checked ? "line-through" : "none" }}>{label}</span>
            {pending && <span style={{ fontSize: 13 }}>⏳</span>}
            {failed && <span title="同步失敗" style={{ fontSize: 13 }}>⚠️</span>}
            <button onClick={onNoteClick} style={{ background: note ? "#fff3e0" : "#f5f5f5", border: `1px solid ${note ? "#f5a623" : "#e0e0e0"}`, borderRadius: 7, padding: "3px 8px", cursor: "pointer", fontSize: 12, color: note ? "#f5a623" : "#bbb", fontWeight: 600 }}>{note ? "📝 備注" : "＋備注"}</button>
          </div>
          {sub && <div style={{ padding: "0 14px 9px 47px", marginTop: -4, fontSize: 11, color: "#aaa", lineHeight: 1.4 }}>{sub}</div>}
          {note && <div onClick={onNoteClick} style={{ padding: "5px 14px 10px 47px", fontSize: 12, color: "#888", cursor: "pointer", lineHeight: 1.5, borderTop: "1px solid #e8f5e9" }}>{note}</div>}
        </div>
      );
    }

    function ProjectChips({ projects, selected, onToggle }) {
      if (!projects.length) return null;
      return (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {projects.map(p => {
            const on = selected.includes(p.project_id);
            return (
              <button key={p.project_id} onClick={() => onToggle(p.project_id)}
                style={{ padding: "5px 11px", borderRadius: 20, border: on ? "1.5px solid #1a1a2e" : "1.5px solid #e0e0e0", background: on ? "#1a1a2e" : "white", color: on ? "white" : "#666", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                {p.project_name || p.project_id}
              </button>
            );
          })}
        </div>
      );
    }

    // 點選順序 = 儲存順序；第一個選的 project 決定它在今日清單裡被分到哪一組。
    // 一個週期要做好幾次的項目（例如一週看三個 section）：一列搞定，右邊每個點是一次。
    function CountHabitRow({ habit, periodKey, logsByKey, onToggle, onEditNote, pendingKeys, failedKeys }) {
      const target = habit.target_count;
      const slots = Array.from({ length: target }, (_, i) => String(i + 1));
      const rowFor = (s) => logsByKey.get(logKey(habit.habit_id, periodKey, s));
      const isDone = (s) => { const r = rowFor(s); return !!(r && r.done); };
      const count = slots.filter(isDone).length;
      const complete = count >= target;
      const nextEmpty = slots.find(s => !isDone(s));
      const lastFilled = [...slots].reverse().find(isDone);
      const pending = slots.some(s => pendingKeys.has(habit.habit_id + '|' + s));
      const failed = slots.some(s => failedKeys.has(habit.habit_id + '|' + s));
      const notes = slots.map(s => { const r = rowFor(s); return (r && r.done && r.note) ? { s, note: r.note } : null; }).filter(Boolean);

      return (
        <div style={{ borderRadius: 12, overflow: "hidden", border: `1.5px solid ${complete ? "#4caf7d" : "#e8e8e8"}`, background: complete ? "#eef7ee" : "#fafafa", transition: "all 0.18s" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 14px" }}>
            <div onClick={() => onToggle(habit, nextEmpty || lastFilled)} style={{ width: 23, height: 23, borderRadius: 6, flexShrink: 0, cursor: "pointer", border: `2px solid ${complete ? "#4caf7d" : "#ccc"}`, background: complete ? "#4caf7d" : "white", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {complete && <span style={{ color: "white", fontSize: 13, fontWeight: 700 }}>✓</span>}
            </div>
            <span style={{ fontSize: 18 }}>{habit.emoji}</span>
            <span onClick={() => onToggle(habit, nextEmpty || lastFilled)} style={{ flex: 1, fontSize: 14, fontWeight: 500, cursor: "pointer", color: complete ? "#333" : "#666", textDecoration: complete ? "line-through" : "none" }}>{habit.habit_name}</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: complete ? "#4caf7d" : "#bbb" }}>{count}/{target}</span>
            <div style={{ display: "flex", gap: 5 }}>
              {slots.map(s => (
                <div key={s} onClick={() => onToggle(habit, s)} title={`第 ${s} 次`}
                  style={{ width: 17, height: 17, borderRadius: "50%", cursor: "pointer", border: `2px solid ${isDone(s) ? "#4caf7d" : "#d5d5d5"}`, background: isDone(s) ? "#4caf7d" : "white" }} />
              ))}
            </div>
            {pending && <span style={{ fontSize: 13 }}>⏳</span>}
            {failed && <span title="同步失敗" style={{ fontSize: 13 }}>⚠️</span>}
            {lastFilled && (
              <button onClick={() => onEditNote(habit, lastFilled)} style={{ background: "#f5f5f5", border: "1px solid #e0e0e0", borderRadius: 7, padding: "3px 8px", cursor: "pointer", fontSize: 12, color: "#bbb", fontWeight: 600 }}>備注</button>
            )}
          </div>
          {notes.length > 0 && (
            <div style={{ padding: "5px 14px 10px 47px", fontSize: 12, color: "#888", lineHeight: 1.6, borderTop: "1px solid #e8f5e9" }}>
              {notes.map(n => <div key={n.s} onClick={() => onEditNote(habit, n.s)} style={{ cursor: "pointer" }}>{n.s}. {n.note}</div>)}
            </div>
          )}
        </div>
      );
    }

    function AddAdhocRow({ onAdd, projects }) {
      const [open, setOpen] = useState(false);
      const [name, setName] = useState("");
      const [selected, setSelected] = useState([]);
      const toggle = (id) => setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const submit = () => { if (name.trim()) { onAdd(name.trim(), selected); setName(""); setSelected([]); setOpen(false); } };
      if (!open) {
        return <button onClick={() => setOpen(true)} style={{ width: "100%", padding: "10px 0", background: "transparent", border: "1.5px dashed #ccc", borderRadius: 12, color: "#999", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>＋ 今天做了這件事</button>;
      }
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <input autoFocus value={name} onChange={e => setName(e.target.value)}
              placeholder="輸入事項名稱…"
              onKeyDown={e => { if (e.key === 'Enter') submit(); }}
              style={{ flex: 1, minWidth: 0, padding: "10px 13px", borderRadius: 10, border: "1.5px solid #ccc", fontSize: 14, outline: "none" }} />
            <button onClick={submit}
              style={{ padding: "0 16px", background: "#1a1a2e", color: "white", border: "none", borderRadius: 10, fontWeight: 700, cursor: "pointer" }}>加入</button>
            <button onClick={() => { setOpen(false); setName(""); setSelected([]); }}
              style={{ padding: "0 12px", background: "#f5f5f5", color: "#888", border: "none", borderRadius: 10, cursor: "pointer" }}>✕</button>
          </div>
          <ProjectChips projects={projects} selected={selected} onToggle={toggle} />
        </div>
      );
    }

    function AddDatedRow({ onAdd, defaultDate, projects }) {
      const [open, setOpen] = useState(false);
      const [name, setName] = useState("");
      const [start, setStart] = useState(defaultDate);
      const [end, setEnd] = useState(defaultDate);
      const [slots, setSlots] = useState("");
      const [projectId, setProjectId] = useState("");
      const submit = () => {
        if (!name.trim() || !start || !end) return;
        const [a, b] = start <= end ? [start, end] : [end, start];
        onAdd(name.trim(), a, b, { slots: slots.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean), projectId });
        setName(""); setSlots(""); setProjectId(""); setOpen(false);
      };
      const dateStyle = { flex: 1, minWidth: 0, padding: "9px 10px", borderRadius: 10, border: "1.5px solid #ccc", fontSize: 14, outline: "none" };
      if (!open) {
        return <button onClick={() => setOpen(true)} style={{ width: "100%", padding: "10px 0", background: "transparent", border: "1.5px dashed #ccc", borderRadius: 12, color: "#999", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>📅 排入指定日期／期間的待辦</button>;
      }
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <input autoFocus value={name} onChange={e => setName(e.target.value)}
            placeholder="例如：領包裹、兩週內去領藥"
            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
            style={{ padding: "10px 13px", borderRadius: 10, border: "1.5px solid #ccc", fontSize: 14, outline: "none" }} />
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="date" value={start} onChange={e => { setStart(e.target.value); if (end < e.target.value) setEnd(e.target.value); }} style={dateStyle} />
            <span style={{ color: "#bbb", fontSize: 13 }}>～</span>
            <input type="date" value={end} min={start} onChange={e => setEnd(e.target.value)} style={dateStyle} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <select value={projectId} onChange={e => setProjectId(e.target.value)} style={{ ...dateStyle, background: "white" }}>
              <option value="">（不分類）</option>
              {projects.map(p => <option key={p.project_id} value={p.project_id}>{p.project_name || p.project_id}</option>)}
            </select>
            <input value={slots} onChange={e => setSlots(e.target.value)} placeholder="時段（選填）例：早,晚,睡前" style={dateStyle} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={submit}
              style={{ flex: 1, padding: "10px 0", background: "#1a1a2e", color: "white", border: "none", borderRadius: 10, fontWeight: 700, cursor: "pointer" }}>排入</button>
            <button onClick={() => setOpen(false)}
              style={{ padding: "0 14px", background: "#f5f5f5", color: "#888", border: "none", borderRadius: 10, cursor: "pointer" }}>✕</button>
          </div>
          <div style={{ fontSize: 11, color: "#bbb", lineHeight: 1.5 }}>單日就把兩個日期選一樣；期間內任何一天勾掉，之後就不會再出現。填了時段就變成一天多次（每個時段各一格，每天都要勾）。</div>
        </div>
      );
    }

    // 打卡頁四個區塊各自該顯示哪些項目；蕃茄鐘的任務下拉也用同一份結果。
    function buildBlocks(habits, logsByKey, ctx) {
      const hasLogThisPeriod = (habit) => {
        const pk = periodKeyForFrequency(habit.frequency_type, ctx);
        for (const k of logsByKey.keys()) { if (k.startsWith(habit.habit_id + '|' + pk + '|')) return true; }
        return false;
      };

      // 有指定日期區間的單次待辦：只看今天是否落在區間內，不管 pinned 或有沒有打過卡。
      const isVisible = (habit) => {
        if (habit.is_temporary && habit.start_date && habit.end_date) {
          if (doneBeforeToday(logsByKey, habit.habit_id, ctx.todayKey)) return false;
          return ctx.todayKey >= habit.start_date && ctx.todayKey <= habit.end_date;
        }
        return habit.pinned || hasLogThisPeriod(habit);
      };

      return BLOCK_DEFS.map(block => ({
        ...block,
        items: habits.filter(h => block.freqs.includes(h.frequency_type) && isVisible(h)),
      }));
    }

    function ChecklistTab({ habits, projects, logsByKey, ctx, onToggle, onEditNote, onAddAdhoc, onAddDated, pendingKeys, failedKeys }) {
      const blocks = buildBlocks(habits, logsByKey, ctx);

      const renderItem = (h) => {
        const periodKey = periodKeyForFrequency(h.frequency_type, ctx);
        if (h.frequency_type === 'daily-multi' && h.frequency_detail.length > 0) {
          return (
            <div key={h.habit_id} style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              <div style={{ fontSize: 13, color: "#888", display: "flex", alignItems: "center", gap: 6 }}><span>{h.emoji}</span>{h.habit_name}</div>
              {h.frequency_detail.map(slot => {
                const k = logKey(h.habit_id, periodKey, slot);
                const row = logsByKey.get(k);
                return (
                  <HabitRow key={slot} icon="•" label={slot}
                    checked={!!(row && row.done)} note={row && row.note}
                    pending={pendingKeys.has(h.habit_id + '|' + slot)} failed={failedKeys.has(h.habit_id + '|' + slot)}
                    onCheck={() => onToggle(h, slot)} onNoteClick={() => onEditNote(h, slot)} />
                );
              })}
            </div>
          );
        }
        if ((h.target_count || 1) > 1) {
          return (
            <CountHabitRow key={h.habit_id} habit={h} periodKey={periodKey} logsByKey={logsByKey}
              onToggle={onToggle} onEditNote={onEditNote} pendingKeys={pendingKeys} failedKeys={failedKeys} />
          );
        }
        const k = logKey(h.habit_id, periodKey, '');
        const row = logsByKey.get(k);
        return (
          <HabitRow key={h.habit_id} icon={h.emoji} label={h.habit_name} sub={dateRangeLabel(h)}
            checked={!!(row && row.done)} note={row && row.note}
            pending={pendingKeys.has(h.habit_id + '|')} failed={failedKeys.has(h.habit_id + '|')}
            onCheck={() => onToggle(h, '')} onNoteClick={() => onEditNote(h, '')} />
        );
      };

      return (

    // 這個項目在目前週期裡還沒勾的第一格（單次項目是 ''、多時段是時段名、一週 N 次是序號）；全部勾完回傳 null。
    function nextOpenSlot(habit, logsByKey, ctx) {
      const periodKey = periodKeyForFrequency(habit.frequency_type, ctx);
      const slots = habit.frequency_type === 'daily-multi' && habit.frequency_detail.length
        ? habit.frequency_detail
        : (habit.target_count > 1 ? Array.from({ length: habit.target_count }, (_, i) => String(i + 1)) : ['']);
      const open = slots.find(s => { const r = logsByKey.get(logKey(habit.habit_id, periodKey, s)); return !(r && r.done); });
      return open === undefined ? null : open;
    }

    // AudioContext 要在使用者動作（按 GO）當下建立/恢復，否則 iOS 不給發聲。
    let audioCtx = null;
    function primeAudio() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { /* 沒聲音也不影響計時 */ }
    }
    function beep() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.value = 880; gain.gain.value = 0.12;
        osc.start();
        setTimeout(() => { try { osc.stop(); } catch (e) {} }, 700);
      } catch (e) {}
    }
    function mmss(ms) {
      const s = Math.ceil(ms / 1000);
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    // ── 小廢貓：從 desktop-pet 的 renderer.js 搬過來的走動/發呆狀態機（拿掉 Electron 拖曳那層）──
    // sprite 512×640，每格 128px：row0 idle[睜眼,眨眼] row1 walk[0-3] row2 蹲坐→站起[0-2] row3 甩尾巴[0,1]
    const PET_ANIM = {
      idle:    { row: 0, frames: [0, 1], frameDuration: 500 },
      walk:    { row: 1, frames: [0, 1, 2, 3], frameDuration: 150 },
      standUp: { row: 2, frames: [0, 1, 2], frameDuration: 180, oneShot: true },
      sitDown: { row: 2, frames: [2, 1, 0], frameDuration: 180, oneShot: true },
      tail:    { row: 3, frames: [0, 1], frameDuration: 350 },
    };
    const PET_CELL = 128;
    const PET_SCALE = 1.25;
    const PET_RENDER = PET_CELL * PET_SCALE;

    // 依今日完成率換心情：0% 懶洋洋、中間正常、100% 精力充沛還會蹦
    function petMood(pct) {
      if (pct >= 100) return { speed: 2.2, idleMin: 600, idleRange: 900, tailChance: 0.2, hop: true };
      if (pct <= 0)   return { speed: 0.8, idleMin: 3000, idleRange: 4000, tailChance: 0.6, hop: false };
      return { speed: 1.2, idleMin: 1500, idleRange: 2500, tailChance: 0.35, hop: false };
    }

    function Pet({ pct }) {
      const wrapperRef = useRef(null);
      const petRef = useRef(null);
      const moodRef = useRef(petMood(pct));
      useEffect(() => { moodRef.current = petMood(pct); }, [pct]);

      useEffect(() => {
        const wrapper = wrapperRef.current, pet = petRef.current;
        let state = 'idle', frameIndex = 0, lastTs = 0, raf = 0;
        let posX = Math.floor(window.innerWidth / 2), direction = 1;
        let timer = 0, duration = 0, hopPhase = 0;
        const anims = {};
        for (const k in PET_ANIM) anims[k] = { ...PET_ANIM[k], _acc: 0, _done: false };

        const switchState = (next) => { state = next; frameIndex = 0; anims[next]._acc = 0; anims[next]._done = false; };
        const startIdle = () => { switchState('idle'); const m = moodRef.current; duration = m.idleMin + Math.random() * m.idleRange; timer = 0; };
        const startTail = () => { switchState('tail'); duration = 1500 + Math.random() * 1500; timer = 0; };
        const startWalk = () => {
          switchState('walk');
          direction = Math.random() < 0.5 ? -1 : 1;
          pet.classList.toggle('facing-left', direction === 1); // 貓原圖面向左，往右走才鏡像
          duration = 1000 + Math.random() * 2000; timer = 0;
        };
        const applyTransform = () => {
          const hop = (state === 'walk' && moodRef.current.hop) ? Math.abs(Math.sin(hopPhase)) * 10 : 0;
          wrapper.style.transform = `translateX(${posX}px) translateY(${-hop}px) scale(${PET_SCALE}) translateZ(0)`;
        };

        const update = (dt) => {
          const maxX = window.innerWidth - PET_RENDER;
          switch (state) {
            case 'walk': {
              timer += dt; hopPhase += dt / 90;
              posX += direction * moodRef.current.speed * (dt / 16.6);
              if (posX <= 0) { posX = 0; direction = 1; pet.classList.add('facing-left'); }
              else if (posX >= maxX) { posX = maxX; direction = -1; pet.classList.remove('facing-left'); }
              applyTransform();
              if (timer >= duration) switchState('sitDown');
              break;
            }
            case 'tail': { timer += dt; if (timer >= duration) startIdle(); break; }
            case 'standUp': { if (anims.standUp._done) startWalk(); break; }
            case 'sitDown': { if (anims.sitDown._done) startIdle(); break; }
            default: {
              timer += dt;
              if (timer >= duration) { Math.random() < moodRef.current.tailChance ? startTail() : switchState('standUp'); }
            }
          }
        };

        const animate = (ts) => {
          if (!lastTs) lastTs = ts;
          const dt = Math.min(ts - lastTs, 100); lastTs = ts;
          update(dt);
          const anim = anims[state];
          anim._acc += dt;
          if (anim._acc >= anim.frameDuration) {
            anim._acc = 0;
            if (anim.oneShot) { if (frameIndex < anim.frames.length - 1) frameIndex++; else anim._done = true; }
            else frameIndex = (frameIndex + 1) % anim.frames.length;
          }
          pet.style.backgroundPosition = `-${anim.frames[frameIndex] * PET_CELL}px -${anim.row * PET_CELL}px`;
          raf = requestAnimationFrame(animate);
        };

        applyTransform();
        startIdle();
        raf = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(raf);
      }, []);

      return (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, height: PET_RENDER, pointerEvents: "none", zIndex: 5, overflow: "hidden" }}>
          <div ref={wrapperRef} style={{ position: "absolute", bottom: 0, left: 0, width: PET_CELL, height: PET_CELL, transformOrigin: "bottom left", willChange: "transform" }}>
            <div ref={petRef} className="pet-sprite" style={{ width: PET_CELL, height: PET_CELL, backgroundImage: "url('pet-sheet.png')", backgroundRepeat: "no-repeat", backgroundSize: "512px 640px", imageRendering: "pixelated" }} />
          </div>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('checklist');
      const [habits, setHabits] = useState([]);
      const [projects, setProjects] = useState([]);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [noteTarget, setNoteTarget] = useState(null); // { habit, slot }
      const [pendingKeys, setPendingKeys] = useState(() => new Set());
      const [failedKeys, setFailedKeys] = useState(() => new Set());
      // 計時狀態放在 App，切分頁不會把倒數打斷；用結束時間戳算剩餘秒數，背景節流也不會走鐘。
      const [pomo, setPomo] = useState({ taskId: '', durationMs: POMODORO_DEFAULT_MS, endsAt: null, remaining: POMODORO_DEFAULT_MS, done: false });

      useEffect(() => {
        if (!pomo.endsAt) return;
        const id = setInterval(() => {
          setPomo(p => {
            if (!p.endsAt) return p;
            const remaining = Math.max(0, p.endsAt - Date.now());
            if (remaining > 0) return { ...p, remaining };
            beep();
            return { ...p, endsAt: null, remaining: 0, done: true };
          });
        }, 250);
        return () => clearInterval(id);
      }, [pomo.endsAt]);

      const ctx = useMemo(() => {
        const bp = businessDateParts();
        return { bp, todayKey: dayKey(bp), weekKey: isoWeekKey(bp), monthKeyStr: monthKey(bp), quarterKeyStr: quarterKey(bp), quarterStart: quarterStartStr(bp) };
      }, []);

      const loadAll = useCallback(async () => {
        setLoading(true);
        setLoadError(false);
        try {
          const [bootRes, logRes] = await Promise.all([
            fetch(`${WORKER_URL}/api/bootstrap`),
            fetch(`${WORKER_URL}/api/log?from=${ctx.quarterStart}&to=${ctx.todayKey}`),
          ]);
          const boot = await bootRes.json();
          const logData = await logRes.json();
          setHabits(boot.habits || []);
          setProjects(boot.projects || []);
          setLogs(logData.logs || []);
        } catch (e) {
          setLoadError(true);
        }
        setLoading(false);
      }, [ctx]);

      useEffect(() => { loadAll(); }, [loadAll]);

      const logsByKey = useMemo(() => {
        const map = new Map();
        for (const l of logs) map.set(logKey(l.habit_id, l.period_key, l.slot), l);
        return map;
      }, [logs]);

      const postLog = useCallback(async (habit, slot, done, note) => {
        const pendingKey = habit.habit_id + '|' + slot;
        const periodKey = periodKeyForFrequency(habit.frequency_type, ctx);
        setPendingKeys(prev => new Set(prev).add(pendingKey));
        setFailedKeys(prev => { const s = new Set(prev); s.delete(pendingKey); return s; });
        setLogs(prev => {
          const idx = prev.findIndex(l => l.habit_id === habit.habit_id && l.period_key === periodKey && (l.slot || '') === slot);
          const row = { date: ctx.todayKey, time: '', habit_id: habit.habit_id, slot, period_key: periodKey, done, note };
          if (idx >= 0) { const copy = [...prev]; copy[idx] = row; return copy; }
          return [...prev, row];
        });
        try {
          const res = await fetch(`${WORKER_URL}/api/log`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ habit_id: habit.habit_id, slot, done, note }),
          });
          if (!res.ok) throw new Error('sync failed');
        } catch (e) {
          setFailedKeys(prev => new Set(prev).add(pendingKey));
        } finally {
          setPendingKeys(prev => { const s = new Set(prev); s.delete(pendingKey); return s; });
        }
      }, [ctx]);

      const handleToggle = useCallback((habit, slot) => {
        const periodKey = periodKeyForFrequency(habit.frequency_type, ctx);
        const row = logsByKey.get(logKey(habit.habit_id, periodKey, slot));
        if (row && row.done) {
          postLog(habit, slot, false, row.note || '');
        } else {
          setNoteTarget({ habit, slot });
        }
      }, [ctx, logsByKey, postLog]);

      const handleNoteClick = useCallback((habit, slot) => {
        setNoteTarget({ habit, slot });
      }, []);

      const handleNoteSubmit = useCallback((note) => {
        const { habit, slot } = noteTarget;
        const periodKey = periodKeyForFrequency(habit.frequency_type, ctx);
        const row = logsByKey.get(logKey(habit.habit_id, periodKey, slot));
        postLog(habit, slot, true, note);
        setNoteTarget(null);
      }, [noteTarget, ctx, logsByKey, postLog]);

      const handleAddAdhoc = useCallback(async (name, project_ids = []) => {
        try {
          const res = await fetch(`${WORKER_URL}/api/habits`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ habit_name: name, emoji: '📌', project_ids }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'failed');
          const newHabit = { habit_id: data.habit_id, habit_name: name, emoji: '📌', project_ids, frequency_type: 'daily', frequency_detail: [], is_temporary: false, active: true, pinned: false };
          setHabits(prev => [...prev, newHabit]);
          await postLog(newHabit, '', true, '');
          return data.habit_id;
        } catch (e) { alert('新增失敗，稍後再試一次'); }
      }, [postLog]);

      const handleAddDated = useCallback(async (name, start, end, { slots = [], projectId = '' } = {}) => {
        try {
          const project_ids = projectId ? [projectId] : [];
          const res = await fetch(`${WORKER_URL}/api/habits`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ habit_name: name, emoji: '📅', is_temporary: true, start_date: start, end_date: end, project_ids, frequency_detail: slots }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'failed');
          setHabits(prev => [...prev, { habit_id: data.habit_id, habit_name: name, emoji: '📅', project_ids, frequency_type: slots.length ? 'daily-multi' : 'daily', frequency_detail: slots, is_temporary: true, start_date: start, end_date: end, active: true, pinned: false }]);
        } catch (e) { alert('新增失敗，稍後再試一次'); }
      }, []);

      // 只開放給臨時加的項目（pinned=false）改 project；固定項目的歸屬在 Sheet 管理。
      const toggleHabitProject = useCallback(async (habit, projectId) => {
        const current = habit.project_ids || [];
        const next = current.includes(projectId) ? current.filter(x => x !== projectId) : [...current, projectId];
        setHabits(prev => prev.map(h => h.habit_id === habit.habit_id ? { ...h, project_ids: next } : h));
        setNoteTarget(prev => prev && prev.habit.habit_id === habit.habit_id ? { ...prev, habit: { ...prev.habit, project_ids: next } } : prev);
        try {
          const res = await fetch(`${WORKER_URL}/api/habits/update`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ habit_id: habit.habit_id, project_ids: next }),
          });
          if (!res.ok) throw new Error('update failed');
        } catch (e) {
          setHabits(prev => prev.map(h => h.habit_id === habit.habit_id ? { ...h, project_ids: current } : h));
          alert('更新 project 失敗，稍後再試一次');
        }
      }, []);

      const startPomo = useCallback(() => {
        primeAudio();
        setPomo(p => {
          const remaining = p.done ? p.durationMs : p.remaining;
          return { ...p, remaining, endsAt: Date.now() + remaining, done: false };
        });
      }, []);
      const pausePomo = useCallback(() => {
        setPomo(p => p.endsAt ? { ...p, remaining: Math.max(0, p.endsAt - Date.now()), endsAt: null } : p);
      }, []);
      const resetPomo = useCallback(() => {
        setPomo(p => ({ ...p, endsAt: null, remaining: p.durationMs, done: false }));
      }, []);
      // 跑的時候不能換時長；暫停或跑完時換，就直接重設成新的時長。
      const setPomoDuration = useCallback((ms) => {
        setPomo(p => p.endsAt ? p : { ...p, durationMs: ms, remaining: ms, done: false });
      }, []);

      const pomoTask = habits.find(h => h.habit_id === pomo.taskId);
      const pomoTaskOpenSlot = pomoTask ? nextOpenSlot(pomoTask, logsByKey, ctx) : null;

      // 走跟打卡頁一樣的勾選流程（跳備注視窗），勾的是這個項目下一個還沒勾的格子。
      const completePomoTask = useCallback(() => {
        if (!pomoTask || pomoTaskOpenSlot === null) return;
        setNoteTarget({ habit: pomoTask, slot: pomoTaskOpenSlot });
        setPomo(p => ({ ...p, endsAt: null, remaining: p.durationMs, done: false }));
      }, [pomoTask, pomoTaskOpenSlot]);

      const todayDoneCount = useMemo(() => {
        const dailyHabits = habits.filter(h => (h.frequency_type === 'daily' || h.frequency_type === 'daily-multi'));
        let total = 0, done = 0;
        for (const h of dailyHabits) {
          const dated = h.is_temporary && h.start_date && h.end_date;
          const inRange = dated && ctx.todayKey >= h.start_date && ctx.todayKey <= h.end_date;
          if (dated && (!inRange || doneBeforeToday(logsByKey, h.habit_id, ctx.todayKey))) continue;
          if (h.frequency_type === 'daily-multi' && h.frequency_detail.length > 0) {
            for (const slot of h.frequency_detail) {
              if (!h.pinned && !inRange && !logsByKey.has(logKey(h.habit_id, ctx.todayKey, slot))) continue;
              total++;
              const row = logsByKey.get(logKey(h.habit_id, ctx.todayKey, slot));
              if (row && row.done) done++;
            }
          } else {
            const row = logsByKey.get(logKey(h.habit_id, ctx.todayKey, ''));
            if (!h.pinned && !inRange && !row) continue;
            total++;
            if (row && row.done) done++;
          }
        }
        return { total, done };
      }, [habits, logsByKey, ctx]);

      const pct = todayDoneCount.total > 0 ? Math.round((todayDoneCount.done / todayDoneCount.total) * 100) : 0;
      const pctColor = pct >= 80 ? "#27ae60" : pct >= 50 ? "#f39c12" : pct > 0 ? "#e74c3c" : "#ddd";

      const TABS = [['pomodoro', '🍅'], ['checklist', '打卡'], ['cat', '胖貓記錄'], ['report', '報表']];

      return (
        <div style={{ minHeight: "100vh", paddingBottom: 200 }}>
          <Pet pct={pct} />
          <div style={{ background: "rgba(255,255,255,0.93)", backdropFilter: "blur(12px)", padding: "20px 24px 14px", borderBottom: "1px solid #f0f0f0", position: "sticky", top: 0, zIndex: 10, boxShadow: "0 2px 16px rgba(0,0,0,0.05)" }}>
            <div style={{ maxWidth: 520, margin: "0 auto" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <h1 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: "#1a1a2e", letterSpacing: -0.5 }}>每日例行事項</h1>
                  <p style={{ margin: "2px 0 0", fontSize: 12, color: "#999" }}>{formatDate(ctx.bp)}</p>
                </div>
                {tab === 'checklist' && (
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 28, fontWeight: 900, color: pctColor, lineHeight: 1 }}>{pct}%</div>
                    <div style={{ fontSize: 11, color: "#bbb", marginTop: 2 }}>{todayDoneCount.done}/{todayDoneCount.total} 完成</div>
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
                {TABS.map(([v, l]) => (
                  <button key={v} onClick={() => setTab(v)}
                    style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "none", background: tab === v ? "#1a1a2e" : "#f2f2f2", color: tab === v ? "white" : "#888", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>{l}</button>
                ))}
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 520, margin: "0 auto", padding: "22px 16px 0" }}>
            {loading && <div style={{ fontSize: 13, color: "#ccc", textAlign: "center", padding: "40px 0" }}>載入中…</div>}
            {!loading && loadError && <div style={{ fontSize: 13, color: "#e74c3c", textAlign: "center", padding: "40px 0" }}>連線失敗，請檢查網路後重新整理</div>}
            {!loading && !loadError && tab === 'pomodoro' && (
              <PomodoroTab blocks={buildBlocks(habits, logsByKey, ctx)} projects={projects} pomo={pomo}
                taskAlreadyDone={!!pomoTask && pomoTaskOpenSlot === null}
                onStart={startPomo} onPause={pausePomo} onReset={resetPomo}
                onSetDuration={setPomoDuration} onCompleteTask={completePomoTask}
                onPickTask={(id) => setPomo(p => ({ ...p, taskId: id }))}
                onAddAdhoc={async (name, project_ids) => { const id = await handleAddAdhoc(name, project_ids); if (id) setPomo(p => ({ ...p, taskId: id })); }} />
            )}
            {!loading && !loadError && tab === 'checklist' && (
              <ChecklistTab habits={habits} projects={projects} logsByKey={logsByKey} ctx={ctx}
                onToggle={handleToggle} onEditNote={handleNoteClick} onAddAdhoc={handleAddAdhoc} onAddDated={handleAddDated}
                pendingKeys={pendingKeys} failedKeys={failedKeys} />
            )}
            {!loading && !loadError && tab === 'cat' && <CatTab ctx={ctx} />}
            {!loading && !loadError && tab === 'report' && <ReportTab ctx={ctx} />}
          </div>

          {noteTarget && (() => {
            const periodKey = periodKeyForFrequency(noteTarget.habit.frequency_type, ctx);
            const row = logsByKey.get(logKey(noteTarget.habit.habit_id, periodKey, noteTarget.slot));
            return (
              <NotePopup label={!noteTarget.slot ? noteTarget.habit.habit_name
                  : (noteTarget.habit.target_count > 1 ? `${noteTarget.habit.habit_name} · 第${noteTarget.slot}次` : `${noteTarget.habit.habit_name} · ${noteTarget.slot}`)}
                icon={noteTarget.habit.emoji} existingNote={row && row.note}
                onSubmit={handleNoteSubmit} onClose={() => setNoteTarget(null)}
                rows={noteTarget.habit.habit_id === JOURNAL_HABIT_ID ? 10 : 3}
                projects={noteTarget.habit.pinned ? null : projects}
                selectedProjects={noteTarget.habit.project_ids}
                onToggleProject={noteTarget.habit.pinned ? null : (pid) => toggleHabitProject(noteTarget.habit, pid)} />
            );
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
